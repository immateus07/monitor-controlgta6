name: Friday Monitor v6
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      testar_telegram:
        description: Enviar mensagem de teste
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: monitor-gta6
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Executar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TESTE_TELEGRAM: ${{ inputs.testar_telegram }}
        run: python monitor.py
      - name: Salvar historico
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historico.json produtos.json
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar historico de ofertas'
            git push
          fi
